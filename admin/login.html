<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión — MetCommerce Admin</title>
    <link rel="stylesheet" href="css/admin.css">
</head>
<body class="login-page">

    <div class="login-card">
        <div class="login-logo">Met<span>Commerce</span></div>
        <p class="login-subtitulo">Panel de administración</p>

        <div class="mensaje-error" id="mensaje-error"></div>

        <form id="form-login">
            <div class="campo">
                <label for="usuario">Usuario</label>
                <input type="text" id="usuario" name="usuario" autocomplete="username" required autofocus>
            </div>
            <div class="campo">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" autocomplete="current-password" required>
            </div>
            <button type="submit" class="btn btn-primario" id="btn-submit">Ingresar</button>
        </form>
    </div>

    <script src="js/api.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
