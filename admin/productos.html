<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productos — MetCommerce Admin</title>
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>

    <div class="admin-layout">
        <aside class="sidebar">
            <div class="sidebar-logo">Met<span>Commerce</span></div>
            <ul class="sidebar-nav">
                <li><a href="dashboard.html">📊 Dashboard</a></li>
                <li><a href="productos.html" class="activo">📦 Productos</a></li>
            </ul>
            <div class="sidebar-footer">
                <button class="btn-logout" id="btn-logout">Cerrar sesión</button>
            </div>
        </aside>

        <main class="main-content">
            <div class="topbar">
                <h1>Productos</h1>
                <div class="usuario-info">Hola, <strong id="nombre-usuario">—</strong></div>
            </div>

            <div class="acciones-pagina">
                <span></span>
                <button class="btn-nuevo" id="btn-nuevo-producto">+ Agregar producto</button>
            </div>

            <section class="panel">
                <div id="tabla-productos"><p class="msg-cargando">Cargando productos...</p></div>
            </section>
        </main>
    </div>

    <!-- MODAL: Agregar / Editar producto -->
    <div class="modal-overlay" id="modal-overlay" hidden>
        <div class="modal">
            <div class="modal-header">
                <h2 id="modal-titulo">Agregar producto</h2>
                <button class="btn-cerrar-modal" id="btn-cerrar-modal">✕</button>
            </div>

            <form id="form-producto">
                <input type="hidden" id="producto-id">

                <div class="campo">
                    <label for="nombre">Nombre</label>
                    <input type="text" id="nombre" required>
                </div>

                <div class="campo">
                    <label for="descripcion">Descripción</label>
                    <textarea id="descripcion" rows="2"></textarea>
                </div>

                <div class="form-fila">
                    <div class="campo">
                        <label for="precio">Precio (COP)</label>
                        <input type="number" id="precio" min="0" step="1" required>
                    </div>
                    <div class="campo">
                        <label for="stock">Stock</label>
                        <input type="number" id="stock" min="0" step="1" required>
                    </div>
                </div>

                <div class="form-fila">
                    <div class="campo">
                        <label for="categoria">Categoría</label>
                        <select id="categoria">
                            <option value="">Sin categoría</option>
                        </select>
                    </div>
                    <div class="campo">
                        <label for="stock_minimo">Stock mínimo</label>
                        <input type="number" id="stock_minimo" min="0" step="1" value="5">
                    </div>
                </div>

                <div class="campo">
                    <label for="imagen_url">URL de imagen</label>
                    <input type="url" id="imagen_url" placeholder="https://...">
                </div>

                <div class="form-acciones">
                    <button type="button" class="btn-cancelar" id="btn-cancelar-modal">Cancelar</button>
                    <button type="submit" class="btn-guardar" id="btn-guardar-producto">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/productos.js"></script>
</body>
</html>
